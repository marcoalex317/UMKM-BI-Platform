# Tema dashboard Rumah Mode Nusantara (navy gelap).
# Warna lain (sidebar, kartu KPI, grafik) diatur di dashboard/utils/theme.py.

[theme]
base = "dark"
primaryColor = "#0083b8"
backgroundColor = "#00172b"
secondaryBackgroundColor = "#0a2a47"
textColor = "#e4e5e5"
font = "sans serif"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
